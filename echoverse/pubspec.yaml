name: echoverse
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Temel paketler
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  image_picker: ^1.1.2
  flutter_tts: ^3.8.5

  # Görsel paketler
  google_fonts: ^6.1.0  
  animate_do: ^3.3.4

  # --- YENİ: HAFIZA PAKETİ ---
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21